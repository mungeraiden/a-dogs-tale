<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | A Dog's Tale</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="login-container">
        <h1>🐶 A Dog's Tale</h1>
        <h2>Welcome Back!</h2>
        <p>Log in to find your perfect match.</p>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Log In</button>
        </form>

        <p id="loginMessage"></p>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
